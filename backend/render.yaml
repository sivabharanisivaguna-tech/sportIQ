databases:
  - name: sportiq-db
    databaseName: sportiq
    user: sportiq_user
    plan: free
    region: oregon
    ipAllowList: [] # only allow internal connections

services:
  - type: web
    name: sportiq-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "SportIQ AI Talent Platform"
      - key: DATABASE_URL
        fromDatabase:
          name: sportiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: BACKEND_CORS_ORIGINS
        value: "https://sportiq.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
